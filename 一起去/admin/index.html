<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一起去 · 管理后台</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>一起去 · 管理后台</div>
    <nav class="tabs">
      <button class="tab active" data-tab="expos">漫展管理</button>
      <button class="tab" data-tab="teams">队伍管理</button>
      <button class="tab" data-tab="review">审核中心</button>
      <button class="tab" data-tab="reports">举报处理</button>
    </nav>
  </header>

  <main>
    <div class="bar">
      <h2 id="page-title">漫展管理</h2>
      <span class="hint">增删改会直接写入数据库</span>
      <button class="btn primary" id="add-btn">＋ 新增</button>
    </div>
    <div class="filterbar" id="filterbar" hidden>
      <label for="filter-expo">漫展</label>
      <select id="filter-expo"><option value="">全部漫展</option></select>
      <input id="filter-search" type="text" placeholder="搜索队伍名称 / 领队 / 出发地" />
    </div>
    <div class="filterbar" id="reviewbar" hidden></div>
    <div class="table-wrap">
      <table id="table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">新增</h3>
        <button class="close" id="modal-close">×</button>
      </div>
      <form id="form"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
